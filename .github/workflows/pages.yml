name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare website
        run: |
          mkdir dist
          cp index.html style.css script.js bubble.js bricks.js wonguikung.js huevon_umb.png huevon_move_umb.png logo-042.png 'Grupo 4.png' sun.svg dist/
          cp -R fonts audio dist/
          sed -i "s/const BUILD_VERSION='[^']*';/const BUILD_VERSION='${{ github.sha }}';/" dist/script.js
          sed -i "s/?v=[0-9a-f]*/?v=${{ github.sha }}/g" dist/index.html
          printf '{"version":"%s"}\n' '${{ github.sha }}' > dist/version.json
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
